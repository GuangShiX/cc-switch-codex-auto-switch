name: Windows source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check public-source privacy and fonts
        run: python scripts/check-public-source.py

      - name: Prepare isolated native test directory
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP 'cc-switch-test-home'
          New-Item -ItemType Directory -Path $testDirectory -Force | Out-Null
          "CC_SWITCH_TEST_HOME=$testDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.3

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Focused account-switch frontend regression
        run: >-
          pnpm exec vitest run
          tests/components/CodexAutoSwitchApi.test.ts
          tests/components/CodexAutoSwitchPanel.test.tsx
          tests/components/CodexOauthQuotaFooter.test.tsx
          tests/components/ProviderActions.test.tsx
          tests/hooks/useProviderActions.test.tsx
          tests/hooks/useDragSort.test.tsx
          tests/hooks/useUsageCacheBridge.test.tsx
          tests/lib/forkUpdater.test.ts
          tests/integration/App.test.tsx

      - name: Build frontend resources
        run: pnpm build:renderer

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"

      - name: Cache Cargo dependencies and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-source-rust-1.95-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-source-rust-1.95-

      - name: Native account-switch and desktop regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib services::codex_

      - name: Synthetic OAuth-token regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib codex_oauth_auth

      - name: Original manual-enable regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib manual_codex_switch_tests

      - name: Check native executable with embedded frontend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin cc-switch --features tauri/custom-protocol
